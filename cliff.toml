# git-cliff configuration for Lime CI builds.
#
# Each push to feat/npatch-libxposed-102 produces a draft GitHub Release tagged
# `ci-<short-sha>`. The release notes are generated by git-cliff from the commit
# history of the working branch, using a template that combines:
#   - conventional-commit grouping (Features / Bug Fixes / Refactor / etc.)
#   - GitHub integration (PR links, contributor credits, "Full Changelog" link)
#
# The workflow runs git-cliff with `--latest --strip header` so only the commits
# belonging to the new `ci-<short-sha>` tag are emitted (i.e. the commits that
# landed since the previous `ci-*` tag). When no previous `ci-*` tag exists yet,
# git-cliff emits all commits since the beginning of the branch.
#
# Reference: https://git-cliff.org/docs/configuration

# GitHub remote integration. Enables PR links, contributor credits, and the
# "Full Changelog: ...compare/A...B..." footer. The token is supplied by the
# workflow via the GITHUB_TOKEN env var (no separate secret needed; the default
# workflow token has read access to public repos and write access to this repo).
[remote.github]
owner = "ancientcatz"
repo = "lime"

[changelog]
# A Tera template to be rendered for each release in the changelog.
# Adapted from git-cliff's official `examples/github.toml` and `config/cliff.toml`:
#   - Conventional-commit grouping is enabled (so commits are bucketed into
#     Features / Bug Fixes / Refactor / etc. instead of a flat "What's Changed"
#     list).
#   - PR links and contributor credits are preserved.
#   - The "Full Changelog: A...B" compare link is preserved.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version %}\
    ## What's Changed in {{ version | trim_start_matches(pat="v") }}
{% else %}\
    ## What's Changed
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}\
      {% if commit.remote.pr_title -%}
        {%- set commit_message = commit.remote.pr_title -%}
      {%- else -%}
        {%- set commit_message = commit.message -%}
      {%- endif -%}
      * {{ commit_message | split(pat="\n") | first | trim }}\
        {% if commit.scope %} *({{ commit.scope }})*{% endif %}\
        {% if commit.breaking %} [**breaking**]{% endif %}\
        {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif %}\
        {% if commit.remote.pr_number %} in \
          [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
        {%- endif %}
    {% endfor %}\
{% endfor %}\
{% if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}

  ### New Contributors
{%- endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor -%}
{%- endif %}

{% if version %}
    {% if previous.version %}
      **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
    {% endif %}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# A Tera template to be rendered as the changelog's footer.
footer = """
<!-- generated by git-cliff -->
"""
# An array of regex based postprocessors to modify the changelog.
postprocessors = []

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
# Set to false so non-conventional commits (e.g. the original master history)
# still appear in the changelog under the "Other" group, instead of being
# silently dropped.
filter_unconventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further
# processing.
commit_preprocessors = [
    # Replace issue numbers with link templates to be updated in
    # `changelog.postprocessors`. Disabled by default; uncomment to enable.
    #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups based on conventional-commit prefixes.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "Miscellaneous Tasks" },
    { body = ".*security", group = "Security" },
    { message = "^revert", group = "Revert" },
    { message = ".*", group = "Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = true
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false

# Trigger: verify git-cliff compares against the previous ci-* tag
