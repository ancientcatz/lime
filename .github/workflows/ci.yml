name: CI

# CI workflow: runs lint checks and unit tests, then builds both debug and release APKs on
# every push to the working branch and on pull requests. Uploads the APKs as workflow
# artifacts (downloadable from the Actions run page) but does NOT create a GitHub Release —
# that is the responsibility of release.yml.
#
# The `validate` job (lint + unit tests) runs first. The `build-debug` and `build-release`
# jobs run in parallel after `validate` succeeds.
#
# Artifact version format: v<versionName>-<short_commit_hash>
#   e.g. lime-v1.4.0-d8a606e9ae19.apk (release)
#        lime-debug-v1.4.0-d8a606e9ae19.apk (debug)
# The versionName is extracted from app/build.gradle.kts at build time.

on:
  push:
    branches:
      - feat/npatch-libxposed-102
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**/*.md'
  pull_request:
    branches:
      - feat/npatch-libxposed-102

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # validate: lint + unit tests. Fast, no signing needed, runs on all events.
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate Gradle configuration
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew --warning-mode=all --no-daemon clean

      - name: Lint (debug)
        run: ./gradlew --warning-mode=all --no-daemon lintDebug

      - name: Unit tests (debug)
        run: ./gradlew --warning-mode=all --no-daemon testDebugUnitTest

  # ─────────────────────────────────────────────────────────────────────────────
  # build-debug: builds the debug APK. No signing secrets needed.
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compute version (v<versionName>-<short_sha>)
        id: version
        run: |
          versionName=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          short_sha=${GITHUB_SHA::12}
          version="v${versionName}-${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

      - name: Build debug APK
        run: ./gradlew --warning-mode=all --no-daemon assembleDebug

      - name: Verify debug APK exists and is non-empty
        run: |
          set -e
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$debug_apk" || { echo "Debug APK missing or empty: $debug_apk"; exit 1; }
          echo "Debug APK: $debug_apk ($(stat -c%s "$debug_apk") bytes)"

      - name: Stage debug APK with version-based name
        run: |
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$debug_apk" "$staging/lime-debug-${{ steps.version.outputs.version }}.apk"
          echo "Staged debug APK:"
          ls -la "$staging"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lime-debug-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/apks/lime-debug-${{ steps.version.outputs.version }}.apk
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # build-release: builds the release APK. Needs signing secrets (only available
  # on push, not on pull_request). On PR, builds unsigned for validation.
  # ─────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build release APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compute version (v<versionName>-<short_sha>)
        id: version
        run: |
          versionName=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          short_sha=${GITHUB_SHA::12}
          version="v${versionName}-${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

      - name: Decode release keystore (only when secrets are available)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        id: keystore
        run: |
          keystore_path="$RUNNER_TEMP/lime-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "LIME_KEYSTORE_FILE=$keystore_path"      >> "$GITHUB_ENV"
          printf 'LIME_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'LIME_KEY_ALIAS=%s\n'         "$ANDROID_KEY_ALIAS"         >> "$GITHUB_ENV"
          printf 'LIME_KEY_PASSWORD=%s\n'      "$ANDROID_KEY_PASSWORD"      >> "$GITHUB_ENV"
          echo "Keystore decoded to runner temp file (path not printed)."

      - name: Build release APK
        run: ./gradlew --warning-mode=all --no-daemon assembleRelease

      - name: Verify release APK exists and is non-empty
        run: |
          set -e
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$release_apk" || { echo "Release APK missing or empty: $release_apk"; exit 1; }
          echo "Release APK: $release_apk ($(stat -c%s "$release_apk") bytes)"

      - name: Verify release APK signature (only when signed)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        run: |
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$release_apk"

      - name: Stage release APK with version-based name
        run: |
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$release_apk" "$staging/lime-${{ steps.version.outputs.version }}.apk"
          echo "Staged release APK:"
          ls -la "$staging"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lime-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/apks/lime-${{ steps.version.outputs.version }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keystore (always, even on failure)
        if: always() && steps.keystore.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/lime-release.jks" ]; then
            shred -u "$RUNNER_TEMP/lime-release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/lime-release.jks"
          fi
          echo "Temporary keystore removed."
