name: Release

# Release workflow: creates a draft GitHub Release with the built APKs. Triggered either
# by pushing a release tag (e.g. `git push origin v1.5.0`) or manually via workflow_dispatch.
#
# Tag push:
#   - The tag (e.g. v1.5.0) already exists on the remote. The workflow checks out that
#     tag's commit, builds the release APK, generates the changelog with git-cliff, and
#     creates a draft release for that tag.
#   - Only the release APK is attached (no debug APK). To include the debug APK, use
#     workflow_dispatch with debug=true instead.
#
# workflow_dispatch:
#   - Inputs:
#       tag:   Release tag (e.g. v1.5.0). If empty (default), the workflow uses the
#              latest existing tag reachable from HEAD (no new tag is created) — useful
#              for rebuilding the release for the latest tag without cutting a new
#              version. If a custom tag is provided and it doesn't exist yet, the
#              workflow creates it at HEAD and pushes it.
#       debug: When true, the debug APK is also attached (default: false).
#   - The workflow checks out the branch tip, builds the release APK (and debug if
#     requested), and creates a draft release for the resolved tag.
#
# Release notes are generated by git-cliff (orhun/git-cliff-action@v4) and consist of
# exactly the changelog output — no wrapping, no metadata table. They start with
# "## What's Changed in <version>".
#
# APK asset filenames use the release tag as the version:
#   release APK: lime-<tag>.apk        (e.g. lime-v1.5.0.apk)
#   debug APK:   lime-debug-<tag>.apk  (e.g. lime-debug-v1.5.0.apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.0). Leave empty to use the latest existing tag."
        required: false
        default: ""
        type: string
      debug:
        description: "Include the debug APK in the release (default: release APK only)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # needed to create draft releases and tags

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # validate: lint + unit tests. Runs first; the build jobs depend on it.
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate Gradle configuration
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew --warning-mode=all --no-daemon clean

      - name: Lint (debug)
        run: ./gradlew --warning-mode=all --no-daemon lintDebug

      - name: Unit tests (debug)
        run: ./gradlew --warning-mode=all --no-daemon testDebugUnitTest

  # ─────────────────────────────────────────────────────────────────────────────
  # build-release: always runs (after validate). Builds the signed release APK.
  # ─────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build release APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode release keystore
        id: keystore
        run: |
          keystore_path="$RUNNER_TEMP/lime-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "LIME_KEYSTORE_FILE=$keystore_path"      >> "$GITHUB_ENV"
          printf 'LIME_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'LIME_KEY_ALIAS=%s\n'         "$ANDROID_KEY_ALIAS"         >> "$GITHUB_ENV"
          printf 'LIME_KEY_PASSWORD=%s\n'      "$ANDROID_KEY_PASSWORD"      >> "$GITHUB_ENV"
          echo "Keystore decoded to runner temp file (path not printed)."

      - name: Build release APK
        run: ./gradlew --warning-mode=all --no-daemon assembleRelease

      - name: Verify release APK exists and is non-empty
        run: |
          set -e
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$release_apk" || { echo "Release APK missing or empty: $release_apk"; exit 1; }
          echo "Release APK: $release_apk ($(stat -c%s "$release_apk") bytes)"

      - name: Verify release APK signature
        run: |
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$release_apk"

      - name: Stage release APK
        run: |
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$release_apk" "$staging/release.apk"
          echo "Staged release APK:"
          ls -la "$staging"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ github.sha }}
          path: ${{ runner.temp }}/apks/release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup keystore (always, even on failure)
        if: always() && steps.keystore.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/lime-release.jks" ]; then
            shred -u "$RUNNER_TEMP/lime-release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/lime-release.jks"
          fi
          echo "Temporary keystore removed."

  # ─────────────────────────────────────────────────────────────────────────────
  # build-debug: only runs when the debug input is true (workflow_dispatch only).
  # Skipped for tag push (releases contain the release APK only by default).
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew --warning-mode=all --no-daemon assembleDebug

      - name: Verify debug APK exists and is non-empty
        run: |
          set -e
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$debug_apk" || { echo "Debug APK missing or empty: $debug_apk"; exit 1; }
          echo "Debug APK: $debug_apk ($(stat -c%s "$debug_apk") bytes)"

      - name: Stage debug APK
        run: |
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$debug_apk" "$staging/debug.apk"
          echo "Staged debug APK:"
          ls -la "$staging"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apks/debug.apk
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # release: waits for build-release (and build-debug if it ran), then creates
  # the draft GitHub Release with the APK(s) and git-cliff-generated notes.
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create draft release
    needs: [build-release]
    # Always run after build-release succeeds. build-debug is conditional
    # (only runs for workflow_dispatch with debug=true), so we don't list it
    # in `needs` — we download its artifact conditionally instead.
    if: ${{ needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for git-cliff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ github.sha }}
          path: ${{ runner.temp }}/apks

      - name: Download debug APK artifact (only when debug input is enabled)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true }}
        uses: actions/download-artifact@v8
        with:
          name: apk-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apks

      - name: Compute release tag
        id: meta
        # For tag push: the tag is github.ref_name (e.g. v1.5.0). It already exists.
        # For workflow_dispatch:
        #   - inputs.tag provided (e.g. v1.5.0): use that tag. If it doesn't exist yet,
        #     a later step creates it at HEAD and pushes it.
        #   - inputs.tag empty: default to the latest existing tag (no new tag created).
        #     This is useful for rebuilding the release for the latest tag (e.g. after
        #     fixing the workflow) without cutting a new version.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release_tag="${{ github.ref_name }}"
            title="${release_tag}"
            echo "Tag push: using tag $release_tag"
          else
            if [ -n "${{ inputs.tag }}" ]; then
              release_tag="${{ inputs.tag }}"
              title="${release_tag}"
              echo "workflow_dispatch with custom tag: $release_tag"
            else
              # Default to the latest existing tag reachable from HEAD.
              release_tag=$(git describe --tags --abbrev=0 2>/dev/null) || {
                echo "ERROR: no tags found in the repository. Provide a tag via the 'tag' input."
                exit 1
              }
              title="${release_tag}"
              echo "workflow_dispatch without tag: defaulting to latest tag $release_tag"
            fi
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Delete existing draft release for this tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if gh release view "${{ steps.meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Existing release found for tag ${{ steps.meta.outputs.release_tag }}; deleting and recreating (tag preserved)."
            gh release delete "${{ steps.meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "No existing release for tag ${{ steps.meta.outputs.release_tag }}; creating fresh."
          fi

      - name: Create local tag at HEAD for git-cliff (workflow_dispatch with custom tag only)
        # Tag push: the tag already exists on the remote and was fetched by checkout.
        #   git-cliff --latest picks it as the newest tag. No local tag creation needed.
        # workflow_dispatch with custom tag: the tag might not exist yet, so create a
        #   local tag at HEAD so git-cliff treats HEAD as the newest tagged release.
        # workflow_dispatch with empty tag (latest): the tag already exists (it's the
        #   latest tag reachable from HEAD). No local tag creation needed.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        run: |
          git tag -f "${{ steps.meta.outputs.release_tag }}" HEAD
          echo "Created local tag ${{ steps.meta.outputs.release_tag }} at HEAD for git-cliff."

      - name: Generate changelog with git-cliff
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/git-cliff-changelog.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag to remote (workflow_dispatch with custom tag only)
        # Tag push: the tag was already pushed (that's what triggered this workflow).
        # workflow_dispatch with custom tag: push the locally-created tag so the next
        #   release can compare against it.
        # workflow_dispatch with empty tag (latest): the tag already exists, no push.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        run: |
          if git push origin "${{ steps.meta.outputs.release_tag }}" 2>&1; then
            echo "Tag ${{ steps.meta.outputs.release_tag }} pushed to remote (or already up-to-date)."
          else
            echo "Tag push failed; retrying with --force (tag may exist at a different commit)..."
            git push --force origin "${{ steps.meta.outputs.release_tag }}"
            echo "Tag ${{ steps.meta.outputs.release_tag }} force-pushed to remote."
          fi

      - name: Rename APKs to version-based filenames
        run: |
          set -e
          version="${{ steps.meta.outputs.release_tag }}"
          release_src="$RUNNER_TEMP/apks/release.apk"
          release_dst="$RUNNER_TEMP/apks/lime-${version}.apk"
          mv "$release_src" "$release_dst"
          echo "Renamed release APK: $release_dst"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.debug }}" = "true" ]; then
            debug_src="$RUNNER_TEMP/apks/debug.apk"
            debug_dst="$RUNNER_TEMP/apks/lime-debug-${version}.apk"
            mv "$debug_src" "$debug_dst"
            echo "Renamed debug APK: $debug_dst"
          fi
          ls -la "$RUNNER_TEMP/apks/"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the asset list: always include the release APK; include the
          # debug APK only for workflow_dispatch with debug=true.
          version="${{ steps.meta.outputs.release_tag }}"
          assets=("$RUNNER_TEMP/apks/lime-${version}.apk")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.debug }}" = "true" ]; then
            assets+=("$RUNNER_TEMP/apks/lime-debug-${version}.apk")
          fi
          echo "Assets to attach: ${assets[@]}"

          # --target is only needed when the tag does not exist yet on the remote
          # (workflow_dispatch with a custom tag that we just created locally).
          # For tag push and for workflow_dispatch with empty tag (latest existing
          # tag), the tag already exists, so no --target.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            target_flag="--target feat/npatch-libxposed-102"
          else
            target_flag=""
          fi

          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            $target_flag \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file "${{ steps.git_cliff.outputs.changelog }}" \
            --draft \
            "${assets[@]}"

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
