name: Build, sign, and publish Orange-NG

# This workflow builds, lints, tests, and signs both debug and release APKs for every
# implementation commit on feat/npatch-libxposed-102. The build is split into three
# concurrent jobs (validate, build-debug, build-release) that run in parallel on separate
# runners — mimicking the approach used for separate ABI builds — so debug and release
# APKs are produced concurrently rather than sequentially within a single Gradle invocation.
#
# A draft GitHub Release is ONLY created when the workflow is triggered manually via
# workflow_dispatch — push events run the full build/lint/test/sign pipeline (so CI
# validates every commit and produces downloadable APK artifacts) but do NOT create a
# release, to avoid cluttering the releases page.
#
# workflow_dispatch accepts two optional inputs:
#   - tag:   Tag name for the release (e.g. "v1.3.0"). If provided, the release is created
#            under that tag — useful for cutting a real versioned release. If left empty,
#            the release is created under the auto-generated ci-<short-sha> tag.
#   - debug: When true, the debug APK is also attached to the release (in addition to the
#            release APK). When false (default), only the release APK is published — debug
#            APKs are for development, not distribution.
#
# Pull-request runs use the same build/lint/test pipeline but skip signing and the release
# job, so untrusted PR code never sees signing secrets.
#
# Security notes:
#  - The personal access token is NEVER embedded in this workflow. We use the automatically
#    provided GITHUB_TOKEN for all GitHub operations (creating releases, uploading assets).
#  - Signing secrets are only referenced inside the build-release job, and only conditionally
#    — for pull_request events the workflow skips the signing step entirely.
#  - The release job runs with contents:write permission. All other jobs use only the
#    default permissions.
#  - Third-party actions are pinned to specific major versions.

on:
  push:
    branches:
      - feat/npatch-libxposed-102
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**/*.md'
  pull_request:
    branches:
      - feat/npatch-libxposed-102
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g. v1.3.0). Leave empty to use ci-<short-sha>."
        required: false
        default: ""
        type: string
      debug:
        description: "Include the debug APK in the release (default: release APK only)."
        required: false
        default: false
        type: boolean

# Concurrency: cancel in-flight runs of the SAME event type on the SAME ref.
# By including github.event_name in the group, a push does NOT cancel a
# workflow_dispatch release (and vice versa) — they run independently. Multiple
# pushes in quick succession still cancel each other (good — saves runner
# minutes), and multiple dispatches in quick succession cancel each other too.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults. The release job escalates to contents:write at the job level.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # validate: runs lint + unit tests. Fast, no signing needed, runs on all events.
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate Gradle configuration
        run: ./gradlew --version

      - name: Lint (debug)
        run: ./gradlew --warning-mode=all --no-daemon lintDebug

      - name: Unit tests (debug)
        run: ./gradlew --warning-mode=all --no-daemon testDebugUnitTest

  # ─────────────────────────────────────────────────────────────────────────────
  # build-debug: builds the debug APK. No signing secrets needed (uses the standard
  # Android debug keystore). Runs on all events including pull requests.
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew --warning-mode=all --no-daemon assembleDebug

      - name: Verify debug APK exists and is non-empty
        run: |
          set -e
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$debug_apk" || { echo "Debug APK missing or empty: $debug_apk"; exit 1; }
          echo "Debug APK: $debug_apk ($(stat -c%s "$debug_apk") bytes)"

      - name: Stage debug APK with a predictable name
        run: |
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$debug_apk" "$staging/orange-ng-v${{ github.sha }}-debug.apk"
          echo "Staged debug APK:"
          ls -la "$staging"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apks/orange-ng-v${{ github.sha }}-debug.apk
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # build-release: builds the release APK. Needs signing secrets (only available
  # on push/workflow_dispatch, not on pull_request). On PR, builds unsigned for
  # validation that R8 + resource shrinking work.
  # ─────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode release keystore (only when secrets are available)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        id: keystore
        run: |
          keystore_path="$RUNNER_TEMP/orange-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "ORANGE_KEYSTORE_FILE=$keystore_path"      >> "$GITHUB_ENV"
          printf 'ORANGE_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ORANGE_KEY_ALIAS=%s\n'         "$ANDROID_KEY_ALIAS"         >> "$GITHUB_ENV"
          printf 'ORANGE_KEY_PASSWORD=%s\n'      "$ANDROID_KEY_PASSWORD"      >> "$GITHUB_ENV"
          echo "Keystore decoded to runner temp file (path not printed)."

      - name: Build release APK
        run: ./gradlew --warning-mode=all --no-daemon assembleRelease

      - name: Verify release APK exists and is non-empty
        run: |
          set -e
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$release_apk" || { echo "Release APK missing or empty: $release_apk"; exit 1; }
          echo "Release APK: $release_apk ($(stat -c%s "$release_apk") bytes)"

      - name: Verify release APK signature (only when signed)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        run: |
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$release_apk"

      - name: Stage release APK with a predictable name
        run: |
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$release_apk" "$staging/orange-ng-v${{ github.sha }}-release.apk"
          echo "Staged release APK:"
          ls -la "$staging"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ github.sha }}
          path: ${{ runner.temp }}/apks/orange-ng-v${{ github.sha }}-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keystore (always, even on failure)
        if: always() && steps.keystore.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/orange-release.jks" ]; then
            shred -u "$RUNNER_TEMP/orange-release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/orange-release.jks"
          fi
          echo "Temporary keystore removed."

  # ─────────────────────────────────────────────────────────────────────────────
  # release: creates or updates a draft GitHub Release. Only runs on
  # workflow_dispatch. Waits for validate + build-debug + build-release to all
  # succeed, then downloads the APK artifacts and creates the release.
  #
  # By default (debug input = false), only the release APK is attached. When
  # debug input = true, the debug APK is also attached.
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create or update draft release
    needs: [validate, build-debug, build-release]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create draft releases and tags
    steps:
      - name: Checkout (full history + tags for git-cliff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ github.sha }}
          path: ${{ runner.temp }}/apks

      - name: Download debug APK artifact (only when debug input is enabled)
        if: ${{ inputs.debug == true }}
        uses: actions/download-artifact@v8
        with:
          name: apk-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apks

      - name: Verify downloaded APKs
        run: |
          set -e
          release_apk="$RUNNER_TEMP/apks/orange-ng-v${{ github.sha }}-release.apk"
          test -s "$release_apk" || { echo "Release APK artifact missing or empty"; exit 1; }
          echo "Release APK: $release_apk ($(stat -c%s "$release_apk") bytes)"
          if [ "${{ inputs.debug }}" = "true" ]; then
            debug_apk="$RUNNER_TEMP/apks/orange-ng-v${{ github.sha }}-debug.apk"
            test -s "$debug_apk" || { echo "Debug APK artifact missing or empty (debug input was true)"; exit 1; }
            echo "Debug APK: $debug_apk ($(stat -c%s "$debug_apk") bytes)"
          else
            echo "Debug APK: not downloaded (debug input is false — release will contain only the release APK)"
          fi

      - name: Compute release tag and title
        id: meta
        run: |
          short_sha=${GITHUB_SHA::12}
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.tag }}" ]; then
            echo "release_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "title=Orange-NG ${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_custom_tag=true" >> "$GITHUB_OUTPUT"
            echo "Using custom tag: ${{ inputs.tag }}"
          else
            echo "release_tag=ci-$short_sha" >> "$GITHUB_OUTPUT"
            echo "title=Orange-NG CI Build $short_sha" >> "$GITHUB_OUTPUT"
            echo "is_custom_tag=false" >> "$GITHUB_OUTPUT"
            echo "Using auto-generated CI tag: ci-$short_sha"
          fi

      - name: Delete existing draft release for this tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if gh release view "${{ steps.meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Existing release found for tag ${{ steps.meta.outputs.release_tag }}; deleting and recreating (tag preserved)."
            gh release delete "${{ steps.meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "No existing release for tag ${{ steps.meta.outputs.release_tag }}; creating fresh."
          fi

      - name: Create local tag at HEAD for git-cliff
        run: |
          git tag -f "${{ steps.meta.outputs.release_tag }}" HEAD
          echo "Created local tag ${{ steps.meta.outputs.release_tag }} at HEAD for git-cliff."

      - name: Generate changelog with git-cliff
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/git-cliff-changelog.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag to remote
        run: |
          if git push origin "${{ steps.meta.outputs.release_tag }}" 2>&1; then
            echo "Tag ${{ steps.meta.outputs.release_tag }} pushed to remote (or already up-to-date)."
          else
            echo "Tag push failed; retrying with --force (tag may exist at a different commit)..."
            git push --force origin "${{ steps.meta.outputs.release_tag }}"
            echo "Tag ${{ steps.meta.outputs.release_tag }} force-pushed to remote."
          fi

      - name: Build release notes (build metadata + git-cliff changelog)
        id: notes
        run: |
          branch=${GITHUB_REF#refs/heads/}
          build_date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          if [ "${{ steps.meta.outputs.is_custom_tag }}" = "true" ]; then
            header="## ${{ steps.meta.outputs.title }}"
            disclaimer="> This is a draft release prepared by CI from the \`$branch\` branch. Review the changelog and assets, then publish the release when ready. The signing identity is temporary and may be replaced later (which would require uninstalling any previously installed build before upgrading)."
          else
            header="## Orange-NG CI Build"
            disclaimer="> This is an automated CI build from the \`$branch\` branch. It is not a stable release. The signing identity is temporary and may be replaced later (which would require uninstalling any previously installed CI build before upgrading)."
          fi
          {
            echo "$header"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | \`$branch\` |"
            echo "| Commit | [\`$GITHUB_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| Built | $build_date |"
            echo "| Run | [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| Debug APK included | ${{ inputs.debug }} |"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- \`orange-ng-v$GITHUB_SHA-release.apk\` — release build, signed with the temporary CI keystore (will be replaced with a permanent signing identity before any stable release)."
            if [ "${{ inputs.debug }}" = "true" ]; then
              echo "- \`orange-ng-v$GITHUB_SHA-debug.apk\` — debug build, signed with the Android debug key."
            fi
            echo ""
            echo "### Install"
            echo ""
            echo "1. Make sure NPatch (or another libxposed API 102 compatible framework) is installed and enabled."
            if [ "${{ inputs.debug }}" = "true" ]; then
              echo "2. Install the release APK (or the debug APK for development)."
            else
              echo "2. Install the release APK."
            fi
            echo "3. Enable the Orange-NG module in NPatch and confirm the scope includes \`com.seleuco.mame4droid\`."
            echo "4. Force-stop or reboot the target app, then verify the configured orientation is applied."
            echo ""
            echo "---"
            echo ""
            echo "## Changelog"
            echo ""
            echo "<!-- The section below is generated by git-cliff from the commit history. -->"
            echo "<!-- See cliff.toml in the repo root for the template and group configuration. -->"
            echo ""
            cat "${{ steps.git_cliff.outputs.changelog }}"
            echo ""
            echo "---"
            echo ""
            echo "$disclaimer"
          } > "$RUNNER_TEMP/release-notes.md"
          echo "Release notes written to $RUNNER_TEMP/release-notes.md"
          echo "--- First 30 lines ---"
          head -30 "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the asset list: always include the release APK; include the
          # debug APK only when the debug input is true.
          assets=("$RUNNER_TEMP/apks/orange-ng-v${{ github.sha }}-release.apk")
          if [ "${{ inputs.debug }}" = "true" ]; then
            assets+=("$RUNNER_TEMP/apks/orange-ng-v${{ github.sha }}-debug.apk")
          fi
          echo "Assets to attach: ${assets[@]}"
          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target feat/npatch-libxposed-102 \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            "${assets[@]}"

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
