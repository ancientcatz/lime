name: Build, sign, and publish Orange-NG

# This workflow builds, lints, tests, signs, and publishes both debug and release APKs for
# every implementation commit on feat/npatch-libxposed-102. Both APKs are attached to a draft
# GitHub Release tagged ci-<short-sha> so each commit has its own testable artifacts.
#
# Pull-request runs use the same build/lint/test pipeline but skip signing and the release job,
# so untrusted PR code never sees signing secrets.
#
# Security notes:
#  - The personal access token is NEVER embedded in this workflow. We use the automatically
#    provided GITHUB_TOKEN for all GitHub operations (creating releases, uploading assets).
#  - Signing secrets are only referenced inside the build job, and only conditionally — for
#    pull_request events the workflow skips the signing step entirely.
#  - The release job runs with contents:write permission. The build job uses only the default
#    permissions.
#  - Third-party actions are pinned to specific major versions.

on:
  push:
    branches:
      - feat/npatch-libxposed-102
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**/*.md'
  pull_request:
    branches:
      - feat/npatch-libxposed-102
  workflow_dispatch:

# Cancel any in-flight run for the same ref when a new commit lands. This avoids wasted runner
# minutes when several commits are pushed in quick succession, but does NOT cancel the run that
# actually produces the draft release for a given commit (because the latest commit's run is the
# one that survives).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults. The release job escalates to contents:write at the job level.
permissions:
  contents: read

jobs:
  build:
    name: Build, lint, test, sign
    runs-on: ubuntu-latest
    env:
      # The four signing secrets are stored under ANDROID_* names. We expose them to the workflow
      # via these env vars so the decode step can find them. The Gradle build reads
      # ORANGE_KEYSTORE_FILE (a PATH, set after decoding), ORANGE_KEYSTORE_PASSWORD,
      # ORANGE_KEY_ALIAS, and ORANGE_KEY_PASSWORD — all four are intentionally left empty here
      # so the decode step (which runs only on push/workflow_dispatch) can decide whether to
      # populate them. For pull_request runs these stay empty and the release APK is built
      # unsigned, which is what we want for PR validation.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components (sdkmanager directly)
        # The ubuntu-latest runner ships with Android SDK cmdline-tools pre-installed at
        # /usr/local/lib/android/sdk. We install the specific platform and build-tools we need
        # via sdkmanager directly. This avoids the android-actions/setup-android action, which
        # mishandles multi-line `packages` inputs (it joins them with newlines and passes the
        # result as a single package name, causing "Failed to find package" errors).
        #
        # Note: the platform package name is `platforms;android-37.0` (with the .0 suffix), not
        # `platforms;android-37`. The sdkmanager repository lists 37.0, 37.1, and 37.2 as
        # distinct packages; the unsuffixed `android-37` alias is not published.
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Accept licenses non-interactively so sdkmanager does not prompt.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Install the three packages we need. Pass them as separate arguments so sdkmanager
          # sees each one distinctly.
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          # Verify the components are actually installed.
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "platforms;android-37.0 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "build-tools;37.0.0 missing"; exit 1; }
          echo "Android SDK components installed."
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate Gradle configuration
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew --warning-mode=all --no-daemon clean

      - name: Lint (debug)
        run: ./gradlew --warning-mode=all --no-daemon lintDebug

      - name: Unit tests (debug)
        run: ./gradlew --warning-mode=all --no-daemon testDebugUnitTest

      - name: Decode release keystore (only when secrets are available)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        id: keystore
        run: |
          # Decode the Base64-encoded keystore from the secret into a temporary runner file.
          # The file lives only on the runner and is wiped in the post step below.
          keystore_path="$RUNNER_TEMP/orange-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          # Expose the four ORANGE_* env vars that Gradle reads. The keystore FILE is the path
          # to the decoded file; the other three are passed through verbatim from the ANDROID_*
          # secrets. The passwords are piped via stdin to printf so they never appear in the
          # process list — printf is a shell builtin so there is no /proc/<pid>/cmdline leak.
          echo "ORANGE_KEYSTORE_FILE=$keystore_path"      >> "$GITHUB_ENV"
          printf 'ORANGE_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ORANGE_KEY_ALIAS=%s\n'         "$ANDROID_KEY_ALIAS"         >> "$GITHUB_ENV"
          printf 'ORANGE_KEY_PASSWORD=%s\n'      "$ANDROID_KEY_PASSWORD"      >> "$GITHUB_ENV"
          echo "Keystore decoded to runner temp file (path not printed)."

      - name: Build debug and release APKs concurrently
        # Combine assembleDebug and assembleRelease into a single Gradle invocation so the
        # configuration phase runs once (instead of twice), and so Gradle's --parallel mode
        # (enabled via org.gradle.parallel=true in gradle.properties) can run the per-variant
        # tasks (debug dexing vs release R8+dexing) concurrently. The two variants share most
        # of the pipeline (resource merging, Java/Kotlin compilation), which Gradle
        # de-duplicates automatically when both are requested in the same invocation.
        run: ./gradlew --warning-mode=all --no-daemon --parallel assembleDebug assembleRelease

      - name: Verify both APKs exist and are non-empty
        run: |
          set -e
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$debug_apk" || { echo "Debug APK missing or empty: $debug_apk"; exit 1; }
          test -s "$release_apk" || { echo "Release APK missing or empty: $release_apk"; exit 1; }
          echo "Debug APK:   $debug_apk ($(stat -c%s "$debug_apk") bytes)"
          echo "Release APK: $release_apk ($(stat -c%s "$release_apk") bytes)"

      - name: Verify release APK signature (only when signed)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        run: |
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          # apksigner exits non-zero if the APK is not signed or the signature is invalid.
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$release_apk"

      - name: Stage APKs with predictable names
        run: |
          # Copy both APKs to a staging directory with predictable names so the upload-artifact
          # step and the release job can reference them without globbing.
          staging="$RUNNER_TEMP/apks"
          mkdir -p "$staging"
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$debug_apk" "$staging/orange-ng-v${{ github.sha }}-debug.apk"
          # If the release APK is signed it's named app-release.apk; if unsigned it's
          # app-release-unsigned.apk. Normalize to a single name.
          cp "$release_apk" "$staging/orange-ng-v${{ github.sha }}-release.apk"
          echo "Staged APKs:"
          ls -la "$staging"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.sha }}
          path: ${{ runner.temp }}/apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keystore (always, even on failure)
        if: always() && steps.keystore.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/orange-release.jks" ]; then
            shred -u "$RUNNER_TEMP/orange-release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/orange-release.jks"
          fi
          echo "Temporary keystore removed."

  release:
    name: Create or update draft release
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create draft releases and tags
    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required by orhun/git-cliff-action so git-cliff can
          # walk the full commit history and find the previous tag to compare
          # against. With the default fetch-depth: 1, git-cliff would only see
          # the single HEAD commit and emit an empty or single-commit changelog.
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: apks-${{ github.sha }}
          path: ${{ runner.temp }}/apks

      - name: Compute CI tag and release title
        id: meta
        run: |
          short_sha=${GITHUB_SHA::12}
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "ci_tag=ci-$short_sha" >> "$GITHUB_OUTPUT"
          echo "title=Orange-NG CI Build $short_sha" >> "$GITHUB_OUTPUT"

      - name: Create temporary local tag at HEAD for git-cliff
        # git-cliff's --latest flag picks the chronologically newest tag reachable
        # from HEAD. The ci-<short-sha> tag does not exist yet (it is created by
        # `gh release create` further down), so we create a lightweight local tag
        # at HEAD first so git-cliff treats HEAD as a tagged release and emits
        # the commits between the previous tag and HEAD. The local tag is deleted
        # in the next step's always-block so it never leaks into the runner's
        # git config or the repo's remote.
        run: |
          git tag "${{ steps.meta.outputs.ci_tag }}" HEAD
          echo "Created local tag ${{ steps.meta.outputs.ci_tag }} at HEAD for git-cliff."

      - name: Generate changelog with git-cliff
        # Uses orhun/git-cliff-action@v4 to generate the release notes from the
        # commit history. The cliff.toml config in the repo root enables:
        #   - conventional-commit grouping (Features / Bug Fixes / Refactor / etc.)
        #   - GitHub integration (PR links, contributor credits, "Full Changelog"
        #     compare link between the previous tag and the new ci-<short-sha> tag)
        # --latest --strip header emits only the section for the latest tag
        # (ci-<short-sha>), without the global "# Changelog" header.
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/git-cliff-changelog.md
          GITHUB_REPO: ${{ github.repository }}
          # GITHUB_TOKEN is supplied to git-cliff's GitHub integration so it can
          # fetch PR metadata and contributor info without hitting the anonymous
          # rate limit. The default workflow token has read access to public
          # repos and write access to this repo, which is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up the temporary local tag
        if: always()
        run: |
          git tag -d "${{ steps.meta.outputs.ci_tag }}" 2>/dev/null || true
          echo "Local tag ${{ steps.meta.outputs.ci_tag }} removed."

      - name: Build release notes (build metadata + git-cliff changelog)
        id: notes
        run: |
          branch=${GITHUB_REF#refs/heads/}
          build_date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          {
            echo "## Orange-NG CI Build"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | \`$branch\` |"
            echo "| Commit | [\`$GITHUB_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| Built | $build_date |"
            echo "| Run | [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- \`orange-ng-v$GITHUB_SHA-debug.apk\` — debug build, signed with the Android debug key."
            echo "- \`orange-ng-v$GITHUB_SHA-release.apk\` — release build, signed with the temporary CI keystore (will be replaced with a permanent signing identity before any stable release)."
            echo ""
            echo "### Install"
            echo ""
            echo "1. Make sure NPatch (or another libxposed API 102 compatible framework) is installed and enabled."
            echo "2. Install the release APK (or the debug APK for development)."
            echo "3. Enable the Orange-NG module in NPatch and confirm the scope includes \`com.seleuco.mame4droid\`."
            echo "4. Force-stop or reboot the target app, then verify the configured orientation is applied."
            echo ""
            echo "---"
            echo ""
            echo "## Changelog"
            echo ""
            echo "<!-- The section below is generated by git-cliff from the commit history. -->"
            echo "<!-- See cliff.toml in the repo root for the template and group configuration. -->"
            echo ""
            cat "${{ steps.git_cliff.outputs.changelog }}"
            echo ""
            echo "---"
            echo ""
            echo "> This is an automated CI build from the \`feat/npatch-libxposed-102\` branch. It is not a stable release. The signing identity is temporary and may be replaced later (which would require uninstalling any previously installed CI build before upgrading)."
          } > "$RUNNER_TEMP/release-notes.md"
          echo "Release notes written to $RUNNER_TEMP/release-notes.md"
          echo "--- First 30 lines ---"
          head -30 "$RUNNER_TEMP/release-notes.md"

      - name: Delete existing draft release for this commit (if any, so a rerun doesn't leave stale assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if gh release view "${{ steps.meta.outputs.ci_tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Existing release found for tag ${{ steps.meta.outputs.ci_tag }}; deleting and recreating to ensure asset freshness."
            gh release delete "${{ steps.meta.outputs.ci_tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "No existing release for tag ${{ steps.meta.outputs.ci_tag }}; creating fresh."
          fi

      - name: Create draft release with both APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.ci_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target feat/npatch-libxposed-102 \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            "$RUNNER_TEMP/apks/orange-ng-v${{ github.sha }}-debug.apk" \
            "$RUNNER_TEMP/apks/orange-ng-v${{ github.sha }}-release.apk"

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.ci_tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
